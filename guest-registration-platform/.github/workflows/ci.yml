name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: guest_registration_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Points all Prisma commands and the test suite at the CI test DB.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/guest_registration_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/guest_registration_test
      # Local providers; Azure integration tests are skipped unless opted in.
      KMS_PROVIDER: local
      KMS_LOCAL_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      STORAGE_PROVIDER: local
      QUEUE_PROVIDER: in-process
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Push schema to test DB
        run: pnpm exec prisma db push --skip-generate --accept-data-loss
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/guest_registration_test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  docker-build:
    name: Docker build (api, worker, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          # Dummy, non-secret value — CI only validates that the image builds.
          build-args: |
            VITE_API_BASE_URL=http://localhost:3000
