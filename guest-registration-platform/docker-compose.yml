services:
  postgres:
    image: postgres:16-alpine
    container_name: guest-registration-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: guest_registration
    ports:
      # Host port 5433 to avoid clashing with other local Postgres instances.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guest_registration"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
